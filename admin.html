<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>پنل مدیر | Minchat</title>
<style>
:root{color-scheme:dark;--bg:#10101c;--panel:#1b1b30;--line:#343451;--accent:#7c5cfc;--muted:#b8b8d2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,Tahoma,sans-serif}main{max-width:1000px;margin:auto;padding:22px 14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}h1{font-size:23px}p,.muted{color:var(--muted);font-size:13px;line-height:1.8}input,button{font:inherit;border-radius:10px;padding:11px;border:1px solid var(--line)}input{background:#111120;color:#fff;width:min(100%,480px)}button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:700}.danger{background:#8a2948}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{margin:12px 0;color:#dedcff}.user{border-top:1px solid var(--line);padding:13px 0;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.id{font-size:12px;overflow-wrap:anywhere;color:#d6d1ff}.hidden{display:none!important}
</style></head><body><main>
<h1>پنل مدیریت Minchat</h1>
<p>مدیر می‌تواند نشست هر کاربر آنلاین را فوراً قطع کند. این نسخه حساب دائمی ندارد؛ این عملیات حذف حساب از پایگاه‌داده نیست.</p>
<section class="panel"><div class="row"><input id="token" type="password" autocomplete="current-password" placeholder="رمز مدیر (ADMIN_TOKEN)"><button id="login">ورود / بارگذاری کاربران</button><button id="refresh" class="hidden">به‌روزرسانی فهرست</button></div><div id="status" class="status" role="status">برای دسترسی، رمز مدیر را وارد کن.</div></section>
<section id="users" class="panel hidden"><h2>کاربران آنلاین</h2><div id="list"></div></section>
<script>
(()=>{const $=id=>document.getElementById(id);let token='';const status=m=>$('status').textContent=m;async function request(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Admin-Token':token,...(options.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'درخواست ناموفق بود');return d}async function load(){try{const d=await request('/admin/api/users');$('users').classList.remove('hidden');$('refresh').classList.remove('hidden');const list=$('list');list.replaceChildren();if(!d.users.length){list.textContent='فعلاً کاربر آنلاینی وجود ندارد.';status('فهرست به‌روز شد.');return}for(const u of d.users){const row=document.createElement('div');row.className='user';const info=document.createElement('div');const id=document.createElement('div');id.className='id';id.textContent='شناسه نشست: '+u.id;const meta=document.createElement('div');meta.className='muted';meta.textContent='کشور: '+(u.country||'—')+' · جنسیت اعلامی: '+(u.gender||'—')+' · وضعیت: '+(u.inCall?'در تماس':u.waiting?'در صف':'آنلاین');info.append(id,meta);const btn=document.createElement('button');btn.className='danger';btn.textContent='حذف نشست / قطع دسترسی';btn.addEventListener('click',async()=>{if(!confirm('نشست این کاربر قطع شود؟'))return;try{await request('/admin/api/users/'+encodeURIComponent(u.id)+'/remove',{method:'POST',body:'{}'});status('نشست کاربر قطع شد.');await load()}catch(e){status(e.message)}});row.append(info,btn);list.append(row)}status('تعداد کاربران آنلاین: '+d.users.length)}catch(e){status(e.message);if(e.message.includes('رمز'))$('users').classList.add('hidden')}}$('login').addEventListener('click',()=>{token=$('token').value.trim();load()});$('refresh').addEventListener('click',load);$('token').addEventListener('keydown',e=>{if(e.key==='Enter'){$('login').click()}})})();
</script></main></body></html>
