<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دموی پنل مدیریت Minchat</title>
<style>body{margin:0;background:#10101c;color:#fff;font-family:Tahoma,system-ui,sans-serif}main{max-width:850px;margin:auto;padding:22px 14px}.panel{background:#1b1b30;border:1px solid #343451;border-radius:16px;padding:16px;margin:14px 0}h1{font-size:23px}.muted{color:#b8b8d2;font-size:13px;line-height:1.9}.notice{padding:12px;border-radius:10px;background:#322b19;color:#ffe6a0;line-height:1.8;font-size:13px}.user{border-top:1px solid #343451;padding:13px 0;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.pill{font-size:12px;color:#d6d1ff}.btn{cursor:pointer;background:#7c5cfc;color:white;border:0;border-radius:10px;padding:10px 13px;font:inherit}.danger{background:#8a2948}.id{overflow-wrap:anywhere;font-size:12px;color:#d6d1ff}.empty{padding:18px 0;color:#b8b8d2}</style></head>
<body><main><h1>دموی آزمایشی پنل مدیر Minchat</h1><p class="muted">این صفحه نمایشی است و به سرور یا کاربران واقعی وصل نیست؛ حذف‌ها فقط در همین صفحه آزمایشی‌اند.</p><div class="notice">حالت دمو — برای مدیریت کاربران واقعی باید نسخه سروری را نصب و متغیر ADMIN_TOKEN را تنظیم کنی.</div><section class="panel"><div class="muted" id="status" role="status">۳ کاربر نمونه برای آزمایش آماده‌اند.</div><h2>کاربران آنلاین نمونه</h2><div id="list"></div><button class="btn" id="reset">بازنشانی کاربران نمونه</button></section></main>
<script>
(()=>{const initial=[{id:'demo-1042',country:'ایران',gender:'زن',state:'در تماس'},{id:'demo-2088',country:'ترکیه',gender:'زن',state:'در صف انتظار'},{id:'demo-3195',country:'آلمان',gender:'زن',state:'آنلاین'}];let users=initial.map(x=>({...x}));const list=document.getElementById('list'),status=document.getElementById('status');function render(){list.replaceChildren();if(!users.length){const e=document.createElement('div');e.className='empty';e.textContent='همه کاربران نمونه حذف شدند. برای شروع دوباره «بازنشانی» را بزن.';list.append(e)}for(const u of users){const row=document.createElement('div');row.className='user';const info=document.createElement('div');const id=document.createElement('div');id.className='id';id.textContent='شناسه: '+u.id;const meta=document.createElement('div');meta.className='muted';meta.textContent=`کشور: ${u.country} · جنسیت اعلامی: ${u.gender} · وضعیت: ${u.state}`;info.append(id,meta);const btn=document.createElement('button');btn.className='btn danger';btn.textContent='حذف کاربر نمونه';btn.onclick=()=>{if(!confirm('این کاربر نمونه از دموی صفحه حذف شود؟'))return;users=users.filter(x=>x.id!==u.id);status.textContent='کاربر نمونه حذف شد؛ این عملیات واقعی نیست.';render()};row.append(info,btn);list.append(row)}if(users.length)status.textContent='کاربران نمونه باقی‌مانده: '+users.length}document.getElementById('reset').onclick=()=>{users=initial.map(x=>({...x}));status.textContent='فهرست نمونه بازنشانی شد.';render()};render()})();
</script></body></html>
